[workspace]
members = ["crates/core", "crates/cli", "crates/pyo3-bindings"]
resolver = "2"

[workspace.package]
version = "1.1.6"
edition = "2021"
license = "MIT"
description = "Rust port of the UMI-tools Python package: deduplicate, group and count reads by Unique Molecular Identifier"
repository = "https://github.com/Bio-Babel/UMI-tools-rust"
authors = ["UMI-tools authors", "Rust port generated by the py2rs workflow"]
keywords = ["bioinformatics", "umi", "sequencing", "deduplication", "genomics"]
categories = ["science", "command-line-utilities"]

[workspace.dependencies]
umi_tools-core = { path = "crates/core", version = "1.1.6" }
thiserror = "2"
regex = "1"
flate2 = "1"
itertools = "0.14"
rand = "0.9"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
noodles-core = "0.20"
noodles-sam = "0.89"
noodles-bam = "0.94"
noodles-cram = "0.98"
noodles-bgzf = "0.51"
noodles-fasta = "0.66"
clap = { version = "4", features = ["derive", "string"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
