[target.x86_64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

[target.aarch64-apple-darwin]
rustflags = ["-C", "link-arg=-undefined", "-C", "link-arg=dynamic_lookup"]

# Linux and Windows do not need an undefined-symbols allowance for a
# PyO3 extension-module cdylib; only macOS's linker rejects the
# intentionally-undefined libpython symbols by default.
